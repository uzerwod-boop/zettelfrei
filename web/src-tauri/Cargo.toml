[package]
name = "zettelfrei"
version = "0.5.0"
description = "Zettelfrei – Excel-Tabellen mit Sätzen bedienen"
authors = ["Bohdan Sychevskyi"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzerwod-boop/zettelfrei"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
