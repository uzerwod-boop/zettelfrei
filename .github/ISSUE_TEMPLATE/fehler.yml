name: 🐞 Fehler melden
description: Etwas funktioniert nicht wie erwartet.
title: "[Fehler] "
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass Sie sich die Zeit nehmen! Bitte **keine echten Kundendaten** hochladen – eine Beispieldatei mit erfundenen Werten reicht.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      placeholder: "Ich habe die Lagerliste geöffnet und „Übernehmen“ geklickt, danach …"
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hätten Sie erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Beispiel „Material_Lager“ öffnen
        2. Reiter „Belege“, Beispiel ZUGFeRD
        3. …
  - type: dropdown
    id: wo
    attributes:
      label: Wo nutzen Sie Zettelfrei?
      options:
        - Online (GitHub Pages)
        - Eigener Rechner (npm start)
        - Im Firmennetz (Server)
        - Anderes
    validations:
      required: true
  - type: dropdown
    id: ki
    attributes:
      label: KI
      options:
        - ohne KI
        - OpenRouter
        - eigener Server
        - Claude API im Browser
        - lokales Modell (z. B. Ollama)
  - type: input
    id: browser
    attributes:
      label: Browser und Betriebssystem
      placeholder: "z. B. Chrome 141, Windows 11"
  - type: textarea
    id: datei
    attributes:
      label: Datei oder Screenshot (optional)
      description: Ziehen Sie eine Beispieldatei oder einen Screenshot hier hinein.
