name: Desktop-Programm

# Baut Zettelfrei für macOS (Apple Silicon + Intel) und Windows und legt die
# Installationsdateien in einen Release-Entwurf. Läuft, wenn sich die Version in
# web/src-tauri/tauri.conf.json ändert, oder von Hand über „Run workflow“.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/src-tauri/tauri.conf.json"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
      - run: npm ci
        working-directory: web
      # Ohne Signaturschlüssel (Secret TAURI_SIGNING_PRIVATE_KEY) bauen wir ohne Update-Dateien statt abzubrechen
      - name: Updates nur mit Signaturschlüssel
        if: ${{ env.HAS_KEY != 'true' }}
        shell: bash
        working-directory: web/src-tauri
        run: node -e "const f='tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f));c.bundle.createUpdaterArtifacts=false;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      # Release-Text und Update-Hinweis im Programm kommen aus dem CHANGELOG-Abschnitt der Version
      - name: Release-Text aus CHANGELOG
        id: notes
        shell: bash
        run: |
          V=$(node -p "require('./web/src-tauri/tauri.conf.json').version")
          { echo "body<<ZF_EOF"; node scripts/release-notes.mjs "$V"; echo "ZF_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: web
          tagName: v__VERSION__
          releaseName: Zettelfrei __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
