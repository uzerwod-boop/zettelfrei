name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Neue Oberfläche bauen (React)
        run: |
          cd web
          npm ci
          npm run build
      - name: Seite zusammenstellen
        run: |
          # Startseite: neue Oberfläche. Die klassische bleibt unter /klassisch/,
          # /app/ (Vorschau aus 0.5) leitet auf die Startseite um.
          cp -r web/dist _site
          mkdir -p _site/klassisch _site/app
          cp -r index.html src vendor fonts _site/klassisch/
          cp -r beispiele docs _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../"><link rel="canonical" href="../"><a href="../">Zettelfrei</a>' > _site/app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
